<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff; border:1px solid #e6e6ef; border-radius:20px; box-shadow:0 20px 50px rgba(20,18,40,0.16); overflow:hidden; font:15px/1.5 'Segoe UI', system-ui, Roboto, sans-serif;">
  <div style="background:#0d0e1e; padding:16px 20px; display:flex; align-items:center; gap:11px;">
    <span style="width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#6b3bff,#9d66ff); display:flex; align-items:center; justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
    </span>
    <div style="flex:1;">
      <div style="color:#f5f6ff; font-weight:600; font-size:14.5px;">Casa Marina</div>
      <div style="color:#7bd4c6; font-size:12px; display:flex; align-items:center; gap:5px;"><span style="width:6px;height:6px;border-radius:50%;background:#4fd3c2;display:inline-block;"></span>{{ mock.online }}</div>
    </div>
  </div>

  <div style="padding:22px 20px; display:flex; flex-direction:column; gap:12px; background:#faf9fd;">
    <div style="align-self:flex-end; max-width:78%; background:#6b3bff; color:#fff; padding:11px 15px; border-radius:16px 16px 4px 16px; font-size:14px; box-shadow:0 3px 10px rgba(107,59,255,0.24);">{{ mock.q1 }}</div>
    <div style="align-self:flex-start; max-width:82%; background:#f0eef4; color:#1c1a22; padding:11px 15px; border-radius:16px 16px 16px 4px; font-size:14px;">{{ mock.a1 }}</div>
    <div style="align-self:flex-end; max-width:78%; background:#6b3bff; color:#fff; padding:11px 15px; border-radius:16px 16px 4px 16px; font-size:14px; box-shadow:0 3px 10px rgba(107,59,255,0.24);">{{ mock.q2 }}</div>
    <div style="align-self:flex-start; max-width:82%; background:#f0eef4; color:#1c1a22; padding:11px 15px; border-radius:16px 16px 16px 4px; font-size:14px;">{{ mock.a2 }}</div>
  </div>

  <div style="padding:14px 18px; border-top:1px solid #eceaf4; display:flex; align-items:center; gap:10px;">
    <div style="flex:1; background:#f3f2f8; border-radius:100px; padding:10px 16px; color:#a29dad; font-size:13.5px;">{{ mock.placeholder }}</div>
    <span style="width:38px; height:38px; border-radius:50%; background:linear-gradient(120deg,#6b3bff,#9d66ff); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:430},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lang = (this.props.t && this.props.t.nav && this.props.t.nav.login === 'Log in') ? 'en' : 'it';
    const strings = {
      it: {
        online: 'Online · risponde nella tua lingua',
        q1: 'A che ora è il check-out?',
        a1: 'Il check-out è entro le 10:30. Lascia le chiavi sul tavolo e chiudi la porta. Buon viaggio! 🌿',
        q2: 'Where can I park nearby?',
        a2: 'There is free street parking on Via del Mare, 50 m from the entrance. A paid garage is 200 m away.',
        placeholder: 'Scrivi un messaggio…',
      },
      en: {
        online: 'Online · answers in your language',
        q1: 'What time is check-out?',
        a1: 'Check-out is by 10:30. Leave the keys on the table and close the door. Safe travels! 🌿',
        q2: 'Où puis-je me garer à proximité ?',
        a2: 'Il y a un stationnement gratuit dans la Via del Mare, à 50 m de l\u2019entrée. Un garage payant est à 200 m.',
        placeholder: 'Type a message…',
      },
    };
    return { mock: strings[lang] };
  }
}
</script>
</body>
</html>
